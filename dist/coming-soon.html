<!-- Enquire Now Modal START -->
<div class="modal fade" id="enquiryModal" tabindex="-1" aria-labelledby="enquiryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold text-white" id="enquiryModalLabel"><i class="bi bi-envelope-check me-2"></i>Get in Touch / Quick Enquiry</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="enquiryForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">I am interested in:</label>
                        <div class="d-flex gap-3 flex-wrap">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="inquiry_type" id="modalFranchise" value="Franchise Inquiry" checked>
                                <label class="form-check-label fw-semibold" for="modalFranchise">Franchise Business</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="inquiry_type" id="modalStudent" value="Student Admission">
                                <label class="form-check-label fw-semibold" for="modalStudent">Student Classes</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="inquiry_type" id="modalOther" value="General Inquiry">
                                <label class="form-check-label fw-semibold" for="modalOther">Others</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Your Name *</label>
                        <input id="modal-name" name="name" class="form-control" placeholder="Enter your full name" required type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address *</label>
                        <input id="modal-email" name="email" class="form-control" placeholder="name@example.com" required type="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Phone / WhatsApp Number *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <span class="fw-bold small">+91</span>
                            </span>
                            <input id="modal-phone" name="phone" class="form-control border-start-0" placeholder="10-digit mobile number" required type="tel" pattern="[0-9]{10}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">City / Location</label>
                        <input id="modal-city" name="city" class="form-control" placeholder="Your City & State" type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Message / Questions</label>
                        <textarea placeholder="Tell us how we can help you..." class="form-control" id="modal-message" name="message" rows="3"></textarea>
                    </div>

                    <button id="modalSendBtn" type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm">
                        <span class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                        Send Enquiry Now
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification -->

                Thank you for your enquiry! Our IPA team will contact you soon.
            </div>
